server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html vani.html love.html;

    # Gzip Compression for fast mobile loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Video streaming support with byte-range headers
    location ~* \.(mp4|webm|ogg|mov)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache photos and static assets
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /index.html;
}
